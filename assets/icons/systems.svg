<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="title">
  <title id="title">Sistemas</title>
  <style>
    .lines { stroke-dasharray: 18; animation: connect 3.2s ease-in-out infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
    @keyframes connect { 0%,100% { stroke-dashoffset: 0; opacity: .65; } 50% { stroke-dashoffset: 4; opacity: 1; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .lines,.node { animation: none; } }
  </style>
  <g stroke="#E6EDF3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path class="lines" d="M12 7.5V11.5M6 16.5V14.5H18V16.5" stroke="#8B949E" fill="none"/>
    <circle class="node" cx="12" cy="5.5" r="2.5"/>
    <circle cx="6" cy="18.5" r="2.5"/>
    <circle cx="18" cy="18.5" r="2.5"/>
  </g>
</svg>