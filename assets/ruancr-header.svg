<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ruancr — UI, UX and systems</title>
  <desc id="desc">Monochrome editorial banner with a bold wordmark and an abstract interface-system diagram.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="#090909"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <path d="M0 0H1200V360H0Z" fill="none" stroke="#ffffff" stroke-opacity=".16"/>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="68" y="62" fill="#a5a5a5" font-size="13" font-weight="600" letter-spacing="3.2">STUDENT / DEVELOPER IN PROGRESS</text>
    <path d="M68 88H612" stroke="url(#fade)" stroke-width="1"/>
    <text x="62" y="204" fill="#f5f5f5" font-size="112" font-weight="800" letter-spacing="-8">ruancr</text>
    <text x="70" y="253" fill="#bdbdbd" font-size="16" font-weight="500" letter-spacing="2.4">UI / UX  ·  SYSTEMS  ·  ROBLOX / LUAU</text>
    <text x="70" y="310" fill="#777777" font-size="12" letter-spacing="2.1">THINK CLEARLY  /  BUILD CAREFULLY</text>
