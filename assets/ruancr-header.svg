<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ruancr — estudante, UI/UX e sistemas</title>
  <desc id="desc">Banner minimalista em preto e branco com tipografia editorial e uma escultura abstrata metálica.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f3f3"/>
      <stop offset=".19" stop-color="#777"/>
      <stop offset=".38" stop-color="#e9e9e9"/>
      <stop offset=".58" stop-color="#555"/>
      <stop offset=".78" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#303030"/>
    </linearGradient>
    <linearGradient id="darkmetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset=".48" stop-color="#202020"/>
      <stop offset="1" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#aaa" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shade" cx=".5" cy=".5" r=".7">
      <stop offset="0" stop-color="#222"/>
      <stop offset="1" stop-color="#080808"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="#090909"/>
  <ellipse cx="1010" cy="170" rx="230" ry="155" fill="#777" opacity=".12" filter="url(#soft)"/>

  <g>
    <path d="M754 340C782 266 804 189 858 119C914 47 990 12 1060 32C1129 52 1168 112 1143 170C1127 207 1088 228 1049 216C1017 206 999 177 1009 148C1021 113 1063 104 1094 126C1087 89 1051 68 1013 75C952 86 906 151 876 216C855 264 839 309 833 340Z" fill="url(#metal)"/>
    <path d="M833 340C848 280 874 218 910 169C947 119 986 93 1020 90C987 114 968 149 974 182C980 216 1009 242 1046 246C1000 267 964 302 941 340Z" fill="#111" opacity=".93"/>
    <path d="M920 340C946 292 977 261 1017 239C1067 211 1124 208 1160 239C1122 224 1082 241 1056 269C1036 292 1021 319 1013 340Z" fill="url(#darkmetal)"/>
    <path d="M866 340C894 268 925 202 967 157C1003 118 1047 97 1080 105C1037 111 1006 140 987 178C962 228 951 286 947 340Z" fill="url(#highlight)" opacity=".58"/>
    <path d="M1065 32C1115 46 1150 85 1155 126C1134 95 1102 77 1064 75C1029 73 1001 88 978 112C996 69 1026 39 1065 32Z" fill="#f4f4f4" opacity=".22"/>
    <path d="M755 340C807 286 840 215 876 161C909 112 951 77 1008 62" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="77" fill="#9d9d9d" font-size="11" font-weight="600" letter-spacing="3.5">ESTUDANTE</text>
    <text x="72" y="195" fill="#f2f2f2" font-size="112" font-weight="800" letter-spacing="-7">ruancr</text>
    <text x="80" y="239" fill="#f1f1f1" font-size="19" font-weight="600" letter-spacing="2.4">UI / UX  <tspan fill="#777">·</tspan>  SISTEMAS</text>
    <text x="80" y="272" fill="#929292" font-size="13" font-weight="500" letter-spacing="2.2">ROBLOX / LUAU  <tspan fill="#555">—</tspan>  WEB</text>
  </g>
  <rect width="1200" height="340" fill="transparent" filter="url(#grain)" opacity=".28"/>
</svg>